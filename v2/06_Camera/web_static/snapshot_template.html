<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera Snapshot — __TS__</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { padding: 10px 16px; background: #1b1b1b; border-bottom: 1px solid #333; }
  header h1 { font-size: 1rem; margin: 0; }
  header .meta { color: #999; font-size: 0.85rem; margin-top: 4px; }
  #wrap { position: relative; display: inline-block; margin: 16px; }
  canvas { display: block; image-rendering: pixelated; border: 1px solid #333; cursor: crosshair; }
  #tip {
    position: fixed; pointer-events: none; background: rgba(20, 20, 20, 0.95);
    border: 1px solid #444; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem;
    line-height: 1.4; white-space: nowrap; display: none; z-index: 10;
  }
  #tip strong { color: #6ee7b7; }
</style>
</head>
<body>
<header>
  <h1>Camera Snapshot</h1>
  <div class="meta">Captured __TS__ &middot; plugin: __PLUGIN__ &middot; __W__x__H__</div>
</header>
<div id="wrap">
  <canvas id="canvas" width="__W__" height="__H__"></canvas>
</div>
<div id="tip"></div>

<script>
const IMG_B64 = "__IMG_B64__";
const RAW = __RAW_JSON__;
const UNITS = { depth: " mm", disparity: " px" };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');

const img = new Image();
img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
img.src = "data:image/png;base64," + IMG_B64;

// Decode each raw stream's base64 payload into a typed array matching its dtype.
const decoded = {};
for (const [name, entry] of Object.entries(RAW)) {
  const bytes = Uint8Array.from(atob(entry.data_b64), (c) => c.charCodeAt(0));
  let arr;
  if (entry.dtype.includes('uint16')) {
    arr = new Uint16Array(bytes.buffer);
  } else if (entry.dtype.includes('float32')) {
    arr = new Float32Array(bytes.buffer);
  } else {
    arr = new Uint8Array(bytes.buffer);
  }
  decoded[name] = { arr, shape: entry.shape };
}

function rawVal(name, x, y) {
  const entry = decoded[name];
  if (!entry) return null;
  const [h, w, ...rest] = entry.shape;
  const channels = rest.length ? rest[0] : 1;
  if (x < 0 || y < 0 || x >= w || y >= h) return null;
  const base = (y * w + x) * channels;
  if (channels === 1) {
    return entry.arr[base];
  }
  // Multi-channel: assume BGR order (OpenCV convention).
  const vals = [];
  for (let c = 0; c < channels; c++) vals.push(entry.arr[base + c]);
  return vals;
}

canvas.addEventListener('mousemove', (evt) => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((evt.clientX - rect.left) * (canvas.width / rect.width));
  const y = Math.floor((evt.clientY - rect.top) * (canvas.height / rect.height));

  const pixel = ctx.getImageData(x, y, 1, 1).data;
  const lines = [`<strong>(${x}, ${y})</strong>`, `RGB: ${pixel[0]}, ${pixel[1]}, ${pixel[2]}`];

  for (const name of Object.keys(decoded)) {
    const val = rawVal(name, x, y);
    if (val == null) continue;
    const unit = UNITS[name] || '';
    const text = Array.isArray(val) ? val.join(', ') : `${val}${unit}`;
    lines.push(`${name}: ${text}`);
  }

  tip.innerHTML = lines.join('<br>');
  tip.style.display = 'block';
  tip.style.left = `${evt.clientX + 16}px`;
  tip.style.top = `${evt.clientY + 16}px`;
});

canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
</script>
</body>
</html>
